server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Model / dataset uploads and full assurance runs can be large and slow.
    client_max_body_size 200m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Docker's embedded DNS; resolving at request time lets nginx start before the backend.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend http://backend:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location /data/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    location /demo_assets/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # Hashed build assets never change; cache them aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
